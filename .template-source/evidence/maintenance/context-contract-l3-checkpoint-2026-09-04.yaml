schema_version: 2
intensity: L3
classification_reason: >-
  统一战略设计根目录 CONTEXT.md、阶段批准前对账、阶段包 schema、战略交接和
  跨仓目标导入合同，命中 lifecycle-gate、cross-repo-contract、core-validator 与
  aggregate-behavior-change。
triggers:
  - lifecycle-gate
  - cross-repo-contract
  - core-validator
  - aggregate-behavior-change
changed_assets:
  - CONTEXT.md
  - AGENTS.md
  - .agents/skills/domain-modeling/
  - .agents/skills/grill-with-docs/
  - .agents/skills/yss-stage-decision/
  - .agents/skills/yss-strategic-design/
  - docs/process/schemas/context-reconciliation.schema.json
  - docs/process/schemas/strategic-design-handoff.schema.json
  - docs/process/lifecycle-registry.yaml
  - scripts/lib/context-contract.mjs
  - scripts/verify-context-contract
  - scripts/verify-context-reconciliation
  - scripts/verify-strategic-design-handoff
  - skills-lock.json
verification_evidence:
  - kind: red
    command: .template-source/evidence/maintenance/context-contract-l3-red-green-2026-09-04.md
    result: pass
  - kind: green
    command: scripts/verify-context-contract-scenarios && scripts/verify-context-reconciliation-scenarios && scripts/verify-strategic-design-handoff-scenarios
    result: pass
  - kind: refactor
    command: .template-source/evidence/maintenance/context-contract-l3-red-green-2026-09-04.md
    result: pass
  - kind: pressure-scenario
    command: node .agents/skills/yss-stage-decision/tests/run-scenarios.mjs && scripts/verify-grill-with-docs-context-scenarios
    result: pass
  - kind: cross-repository-verification
    command: cd ../create-yss-strategic-design && npm test
    result: pass
  - kind: self-check
    command: scripts/sync-skills --check && scripts/update-skill-lock --check && scripts/verify-skill-governance
    result: pass
  - kind: fresh-verification
    command: scripts/verify-template-fast
    result: pass
review_mode: self-check
escalation: >-
  none；当前仅达到战略设计源仓 implementation-ready；主模板固定提交、Git 提交、
  push 与正式发布仍需后续显式动作和批准。
target_state: implementation-ready
current_state: implementation-ready
verification_profile: fast
review_round: 0
candidate_digest: null
