  - scripts/lib/strategic-handoff.mjs
  - scripts/lib/harness-profile.mjs
  - scripts/verify-strategic-handoff-package-scenarios
  - scripts/verify-strategic-checkpoint-scenarios
  - .agents/skills/yss-strategic-design/
  - skills-lock.json
  - ../yss-harness-backend-agent
  - ../yss-harness-frontend-agent
  - ../create-yss-spec
  - ../create-yss-strategic-design
