  整包验证和 checkpoint 证据设为 strategic-design-handoff 的完成条件；同时升级 Handoff v5、
  Import Receipt v3、三条消费者路线、共享工具同步和四个 CLI 快照，命中 lifecycle-gate、
  generation-semantics、cross-repo-contract、core-validator 与 aggregate-behavior-change。
